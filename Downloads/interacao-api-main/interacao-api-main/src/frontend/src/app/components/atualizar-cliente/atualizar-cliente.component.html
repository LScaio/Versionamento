<div class="card">
  <div class="card-header">✏️ Editar Cliente</div>
  <div class="card-body">
    <form (ngSubmit)="salvar()">
      <div class="mb-3">
        <label class="form-label">Nome</label>
        <input class="form-control" name="nome" [(ngModel)]="cliente.nome" required />
      </div>
      <div class="mb-3">
        <label class="form-label">Endereço</label>
        <input class="form-control" name="endereco" [(ngModel)]="cliente.endereco" required />
      </div>
      <button class="btn btn-success" type="submit">
  <i class="bi bi-floppy-fill"></i>
  Salvar
</button>
    </form>
  </div>
</div>
